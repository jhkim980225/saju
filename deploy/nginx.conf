server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # API 프록시 (docker-compose 의 api 서비스)
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health { proxy_pass http://api:4000/health; }

  # 해시된 정적 자산은 장기 캐시
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # 사전 렌더링된 화면(dist/<경로>/index.html)이 있으면 그것을, 없으면 SPA index.html
  # ($uri/ 를 쓰지 않는다 — 디렉터리에 걸리면 끝에 / 를 붙여 301 하므로 대표 주소가 달라진다)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /index.html;
  }
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
  location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
