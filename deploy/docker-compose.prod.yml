# 운영 실행(서버 1대) — Caddy(HTTPS 자동 발급) → web(nginx: 정적 파일 + /api 프록시) → api → db(PostgreSQL)
#
#   cp deploy/api.prod.env.example deploy/api.prod.env   # 값 채우기
#   cp deploy/.env.example deploy/.env                   # DOMAIN · POSTGRES_PASSWORD
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# 절차 전체: docs/DEPLOY.md
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saju
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env 에 POSTGRES_PASSWORD 를 지정하세요}
      POSTGRES_DB: saju
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saju -d saju"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
  api:
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    env_file: api.prod.env
    environment:
      NODE_ENV: production
      # Caddy → nginx → api 두 단계 프록시
      TRUST_PROXY_HOPS: "2"
      DATABASE_URL: postgres://saju:${POSTGRES_PASSWORD}@db:5432/saju
      PUBLIC_WEB_URL: https://${DOMAIN:?deploy/.env 에 DOMAIN 을 지정하세요}
      CORS_ORIGINS: https://${DOMAIN},capacitor://localhost,https://localhost
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        PUBLIC_WEB_URL: https://${DOMAIN}
    depends_on: [api]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  db-data:
  caddy-data:
  caddy-config:
