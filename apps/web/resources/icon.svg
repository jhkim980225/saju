<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    달빛사주 앱 아이콘 원본 (1024×1024, 투명 영역 없음 — App Store 아이콘 규격)
    한지색 바탕 + 인주색 낙관(음각 초승달). 도형은 폰트 없이 패스로 그려 어떤 렌더러에서도 같게 나온다.
    색: 한지 #F7F3EC · 인주 #A63A2B (brand.seal) · 먹 #1F1D1A
    낙관은 가운데 600px 안에 있어 iOS 모서리 마스크·Android 적응형 아이콘 안전 영역(66%)을 넘지 않는다.
    생성 방법: docs/APP_PORTING.md "아이콘·스플래시" (@capacitor/assets)
  -->
  <rect width="1024" height="1024" fill="#F7F3EC"/>
  <g id="seal">
    <!-- 도장 몸체 -->
    <rect x="212" y="212" width="600" height="600" rx="56" fill="#A63A2B"/>
    <!-- 음각 테두리 -->
    <rect x="254" y="254" width="516" height="516" rx="26" fill="none" stroke="#F7F3EC" stroke-width="12"/>
    <!-- 초승달(음각): 큰 원에서 오른쪽 위로 비켜 난 원을 뺀 모양. Seal.tsx 의 CRESCENT_PATH 와 같은 도형(32 단위 → 낙관 600px) -->
    <path fill="#F7F3EC" transform="translate(212 212) scale(20.69) translate(-1.5 -1.5)" d="M14.84 8.08 A8.4 8.4 0 1 0 23.93 19.17 A7.2 7.2 0 0 1 14.84 8.08 Z"/>
  </g>
</svg>
